<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento de Férias 2027</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#243044}.card{background:#fff;border-radius:14px;box-shadow:0 8px 25px #00000012}.btn{border:0;border-radius:9px;padding:13px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.msg{margin-top:10px;padding:10px;border-radius:8px;font-size:14px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:#fff;width:min(100%,520px);border-radius:14px;overflow:hidden}.modal-head{background:#24438f;color:white;padding:20px}.modal-body{padding:20px}.field{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:11px;background:#fff}.choice{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-top:14px}.label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}.sub{font-size:12px;color:#64748b;margin:4px 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="max-w-xl mx-auto p-4 sm:p-6">
<section class="card overflow-hidden">
<header class="bg-blue-900 text-white p-5"><h1 class="text-xl font-bold">Agendamento de Férias</h1><p class="text-sm opacity-90">Exercício 2027</p></header>
<div class="p-5">
<section id="telaLogin"><h2 class="text-lg font-bold mb-1">Acesso do servidor</h2><p class="text-sm text-gray-500 mb-5">Informe seu CPF e RE para continuar.</p>
<form id="formLogin"><label class="label">CPF</label><input id="cpf" class="field mb-3" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required><label class="label">RE</label><input id="re" class="field" required><button id="btnLogin" class="btn bg-blue-800 text-white w-full mt-5">Entrar</button></form><div id="mensagemLogin"></div></section>
<section id="telaEscolhas" class="hidden"><div class="mb-4"><div class="text-sm text-gray-500">Servidor</div><div id="nomeServidor" class="font-bold"></div></div><form id="formFerias"><div id="opcoes"></div><div id="mensagemEscolhas"></div><div class="flex flex-col sm:flex-row gap-3 mt-5"><button type="button" class="btn bg-gray-200 flex-1" onclick="voltarLogin()">Voltar</button><button type="button" id="btnLimpar" class="btn bg-yellow-500 text-white flex-1" onclick="limparEscolhas()">LIMPAR</button><button type="submit" id="btnEnviar" class="btn bg-green-700 text-white flex-1">Confirmar e Enviar</button></div></form></section>
</div><footer class="text-center text-xs text-gray-400 pb-4">Elaborado por: Cb PM Ciquiroli</footer>
</section></main>
<div id="modalConfirmacao" class="modal-bg hidden"><div class="modal"><div class="modal-head"><h2 class="font-bold text-lg">Confirmar agendamento</h2><p class="text-sm mt-1">Confira cuidadosamente suas opções.</p></div><div class="modal-body"><div id="resumoConfirmacao" class="text-sm whitespace-pre-line"></div><div class="flex gap-3 mt-5"><button class="btn bg-gray-200 flex-1" onclick="fecharModal()">Cancelar</button><button id="btnConfirmarEnvio" class="btn bg-green-700 text-white flex-1" onclick="enviarDados()">Confirmar</button></div></div></div></div>
<div id="modalSucesso" class="modal-bg hidden"><div class="modal text-center p-6"><h2 class="text-xl font-bold text-green-700">Agendamento enviado</h2><p id="mensagemSucesso" class="mt-3"></p><button class="btn bg-blue-800 text-white mt-5" onclick="voltarLogin()">Voltar ao login</button></div></div>
<script>
const URL_APPS_SCRIPT='https://script.google.com/macros/s/AKfycbwzqcFMc-9O36obaHAaDkriPkhD1fkyh7xLyxAJQ9XFobpaIIU3zSWk7izUbL4pUwYn/exec';
const MESES=[['01','Janeiro'],['02','Fevereiro'],['03','Março'],['04','Abril'],['05','Maio'],['06','Junho'],['07','Julho'],['08','Agosto'],['09','Setembro'],['10','Outubro'],['11','Novembro'],['12','Dezembro']];
let cpfUsuario='',nomeUsuario='';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function optionMes(id){return '<select id="'+id+'" class="field" required><option value="" selected disabled>Selecione o mês</option>'+MESES.map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join('')+'</select>'}
function criarOpcoes(){let h='';for(let i=1;i<=3;i++)h+=`<div class="choice"><h3 class="font-bold mb-3">${i}ª Opção</h3><label class="label">Tipo de férias</label><select id="tipo${i}" class="field" required onchange="alterarTipo(${i})"><option value="" selected disabled>Selecione o tipo de período</option><option value="30">30 dias diretos</option><option value="15">15 + 15 dias</option></select><div id="bloco30_${i}" class="hidden mt-3"><label class="label">Mês de início</label>${optionMes('mes'+i)}<label class="label mt-3">Data de início</label><input id="data${i}" type="date" class="field" disabled required></div><div id="bloco15_${i}" class="hidden mt-3"><p class="sub">Os dois períodos devem iniciar em meses diferentes.</p><div class="grid2"><div><label class="label">1º mês</label>${optionMes('mes'+i+'a')}<label class="label mt-2">Início</label><input id="data${i}a" type="date" class="field" disabled required></div><div><label class="label">2º mês</label>${optionMes('mes'+i+'b')}<label class="label mt-2">Início</label><input id="data${i}b" type="date" class="field" disabled required></div></div></div></div>`;document.getElementById('opcoes').innerHTML=h}
function diasMes(m){return new Date(2027,Number(m),0).getDate()}
function configurarData(el,m){if(!el)return;el.disabled=!m;if(m){el.min=`2027-${m}-01`;el.max=`2027-${m}-${String(diasMes(m)).padStart(2,'0')}`}else{el.value='';el.removeAttribute('min');el.removeAttribute('max')}}
function alterarTipo(i){let t=document.getElementById('tipo'+i).value;document.getElementById('bloco30_'+i).classList.toggle('hidden',t!=='30');document.getElementById('bloco15_'+i).classList.toggle('hidden',t!=='15');if(t==='30'){configurarData(document.getElementById('data'+i),document.getElementById('mes'+i).value)}else if(t==='15'){configurarData(document.getElementById('data'+i+'a'),document.getElementById('mes'+i+'a').value);configurarData(document.getElementById('data'+i+'b'),document.getElementById('mes'+i+'b').value)}}
function selecionarMes(id,dataId){let m=document.getElementById(id).value;configurarData(document.getElementById(dataId),m);atualizarBloqueiosMeses()}
function obter(i){let t=document.getElementById('tipo'+i).value;if(t==='30'){let m=document.getElementById('mes'+i).value,d=document.getElementById('data'+i).value;return {tipo:t,meses:[m],inicio:[d]}}let a=document.getElementById('mes'+i+'a').value,b=document.getElementById('mes'+i+'b').value,da=document.getElementById('data'+i+'a').value,db=document.getElementById('data'+i+'b').value;return {tipo:t,meses:[a,b],inicio:[da,db]}}
function validar(){let arr=[];for(let i=1;i<=3;i++){let x=obter(i);if(!x.tipo||x.meses.some(m=>!m)||x.inicio.some(d=>!d))return 'Preencha completamente as três opções.';if(x.tipo==='15'&&x.meses[0]===x.meses[1])return 'Na opção '+i+', os períodos 15 + 15 devem estar em meses diferentes.';arr.push(x)}for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(arr[i].tipo===arr[j].tipo&&arr[i].meses.some(m=>arr[j].meses.includes(m)))return 'As opções '+(i+1)+' e '+(j+1)+' não podem repetir mês quando possuem o mesmo tipo de férias.';return ''}
function atualizarBloqueiosMeses(){for(let i=1;i<=3;i++)for(const id of ['mes'+i,'mes'+i+'a','mes'+i+'b']){let s=document.getElementById(id);if(!s)continue;[...s.options].forEach(o=>o.disabled=false)}let usados=[];for(let i=1;i<=3;i++){let x=obter(i);if(x.tipo)usados.push(x)}for(let i=1;i<=3;i++){let x=obter(i);for(const id of ['mes'+i,'mes'+i+'a','mes'+i+'b']){let s=document.getElementById(id);if(!s)continue;[...s.options].forEach(o=>{if(!o.value)return;let bloquear=usados.some(y=>y!==x&&y.tipo===x.tipo&&y.meses.includes(o.value));if(x.tipo==='15'&&id.endsWith('b')&&o.value===document.getElementById('mes'+i+'a').value)bloquear=true;if(x.tipo==='15'&&id.endsWith('a')&&o.value===document.getElementById('mes'+i+'b').value)bloquear=true;o.disabled=bloquear})}}}
function resumo(i){let x=obter(i),n=m=>MESES.find(a=>a[0]===m)?.[1]||'';if(x.tipo==='30')return `${i}ª OPÇÃO\n30 dias | ${n(x.meses[0])} | Início: ${x.inicio[0]}`;return `${i}ª OPÇÃO\n15 + 15 dias | ${n(x.meses[0])} (${x.inicio[0]}) + ${n(x.meses[1])} (${x.inicio[1]})`}
function abrirConfirmacao(){let erro=validar();if(erro){mostrar('mensagemEscolhas',erro,true);return}document.getElementById('resumoConfirmacao').textContent='Servidor: '+nomeUsuario+'\n\n'+[1,2,3].map(resumo).join('\n\n')+'\n\nConfira todas as informações antes de confirmar o envio.';document.getElementById('modalConfirmacao').classList.remove('hidden')}
async function enviarDados(){let b=document.getElementById('btnConfirmarEnvio');b.disabled=true;try{let dados={acao:'salvar',cpf:cpfUsuario,nome:nomeUsuario,op1:resumo(1),op2:resumo(2),op3:resumo(3)};let r=await fetch(URL_APPS_SCRIPT,{method:'POST',body:JSON.stringify(dados)});let txt=await r.text();console.log('Resposta do servidor:',txt);let out=JSON.parse(txt);if(!out.sucesso){if(out.jaEnviado)throw Error(out.mensagem+' Protocolo: '+(out.protocolo||''));throw Error(out.mensagem||'Falha ao salvar.')}fecharModal();document.getElementById('mensagemSucesso').textContent='Protocolo: '+out.protocolo;document.getElementById('modalSucesso').classList.remove('hidden')}catch(e){alert('Erro ao enviar dados:\n\n'+e.message)}finally{b.disabled=false}}
function mostrar(id,t,erro){let e=document.getElementById(id);e.textContent=t;e.className='msg '+(erro?'err':'ok')}
function fecharModal(){document.getElementById('modalConfirmacao').classList.add('hidden')}
function liberarTodosOsMeses(){document.querySelectorAll('select[id^="mes"]').forEach(s=>[...s.options].forEach(o=>o.disabled=false))}
function limparEscolhas(){if(!confirm('Deseja realmente limpar todas as escolhas de férias?'))return;document.getElementById('formFerias').reset();for(let i=1;i<=3;i++){document.getElementById('bloco30_'+i).classList.add('hidden');document.getElementById('bloco15_'+i).classList.add('hidden');['data'+i,'data'+i+'a','data'+i+'b'].forEach(id=>configurarData(document.getElementById(id),''))}liberarTodosOsMeses();document.getElementById('mensagemEscolhas').innerHTML='';fecharModal();document.getElementById('tipo1').focus()}
function limparEscolhasSemConfirmacao(){document.getElementById('formFerias').reset();for(let i=1;i<=3;i++){document.getElementById('bloco30_'+i).classList.add('hidden');document.getElementById('bloco15_'+i).classList.add('hidden')}liberarTodosOsMeses()}
function voltarLogin(){fecharModal();document.getElementById('modalSucesso').classList.add('hidden');document.getElementById('telaEscolhas').classList.add('hidden');document.getElementById('telaLogin').classList.remove('hidden');document.getElementById('formLogin').reset();document.getElementById('mensagemLogin').innerHTML='';limparEscolhasSemConfirmacao()}
function mascaraCPF(v){return v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
async function realizarLogin(){let b=document.getElementById('btnLogin');b.disabled=true;document.getElementById('mensagemLogin').innerHTML='';try{let r=await fetch(URL_APPS_SCRIPT,{method:'POST',body:JSON.stringify({acao:'login',cpf:document.getElementById('cpf').value,re:document.getElementById('re').value})});let txt=await r.text();if(!txt.trim()||txt.trim().startsWith('<'))throw Error('O servidor retornou uma resposta inválida. Verifique a implantação do Apps Script.');let out=JSON.parse(txt);if(!out.sucesso){if(out.jaEnviado){mostrar('mensagemLogin',(out.mensagem||'Este usuário já realizou o envio.')+'<br><strong>Protocolo: '+(out.protocolo||'não informado')+'</strong>',true);return;}throw Error(out.mensagem||'CPF ou RE inválidos.')}cpfUsuario=out.cpf;nomeUsuario=out.nome||'';document.getElementById('nomeServidor').textContent=nomeUsuario;document.getElementById('telaLogin').classList.add('hidden');document.getElementById('telaEscolhas').classList.remove('hidden');limparEscolhasSemConfirmacao()}catch(e){mostrar('mensagemLogin',e.message,true)}finally{b.disabled=false}}
document.addEventListener('DOMContentLoaded',()=>{criarOpcoes();document.getElementById('cpf').addEventListener('input',e=>e.target.value=mascaraCPF(e.target.value));document.getElementById('formLogin').addEventListener('submit',e=>{e.preventDefault();realizarLogin()});document.getElementById('formFerias').addEventListener('submit',e=>{e.preventDefault();abrirConfirmacao()});for(let i=1;i<=3;i++){for(const id of ['mes'+i,'mes'+i+'a','mes'+i+'b'])document.getElementById(id)?.addEventListener('change',()=>{let suffix=id.endsWith('a')?'a':id.endsWith('b')?'b':'';selecionarMes(id,'data'+i+suffix)});}});
</script>
</body></html>
