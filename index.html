<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento de Férias 2027</title>
<script src="[cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#243044}
.card{background:#fff;border-radius:14px;box-shadow:0 8px 25px #00000012}
.btn{border:0;border-radius:9px;padding:13px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.msg{margin-top:10px;padding:10px;border-radius:8px;font-size:14px}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:#fff;width:min(100%,520px);border-radius:14px;overflow:hidden}
.modal-head{background:#24438f;color:white;padding:20px}
.modal-body{padding:20px}
.field{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:11px;background:#fff}
.choice{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-top:14px}
.label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}
.sub{font-size:12px;color:#64748b;margin:4px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="max-w-xl mx-auto p-4 sm:p-6">
  <section class="card overflow-hidden">
    <header class="bg-blue-900 text-white p-5">
      <h1 class="text-xl font-bold">Agendamento de Férias</h1>
      <p class="text-sm opacity-90">Exercício 2027</p>
    </header>
    <div class="p-5">
      <section id="telaLogin">
        <h2 class="text-lg font-bold mb-1">Acesso do servidor</h2>
        <p class="text-sm text-gray-500 mb-5">Informe seu CPF e RE para continuar.</p>
        <form id="formLogin">
          <label class="label">CPF</label>
          <input id="cpf" class="field mb-3" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
          <label class="label">RE</label>
          <input id="re" class="field" autocomplete="off" required>
          <button id="btnLogin" class="btn bg-blue-800 text-white w-full mt-5">Entrar</button>
        </form>
        <div id="mensagemLogin"></div>
      </section>

      <section id="telaEscolhas" class="hidden">
        <div class="mb-4">
          <div class="text-sm text-gray-500">Servidor</div>
          <div id="nomeServidor" class="font-bold"></div>
        </div>
        <form id="formFerias">
          <div id="opcoes"></div>
          <div id="mensagemEscolhas"></div>
          <div class="flex flex-col sm:flex-row gap-3 mt-5">
            <button type="button" class="btn bg-gray-200 flex-1" onclick="voltarLogin()">Voltar</button>
            <button type="button" id="btnLimpar" class="btn bg-yellow-500 text-white flex-1" onclick="limparEscolhas()">LIMPAR</button>
            <button type="submit" id="btnEnviar" class="btn bg-green-700 text-white flex-1">Confirmar e Enviar</button>
          </div>
        </form>
      </section>
    </div>
    <footer class="text-center text-xs text-gray-400 pb-4">Elaborado por: Cb PM Ciquiroli</footer>
  </section>
</main>

<div id="modalConfirmacao" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 class="font-bold text-lg">Confirmar agendamento</h2>
      <p class="text-sm mt-1">Confira cuidadosamente suas opções.</p>
    </div>
    <div class="modal-body">
      <div id="resumoConfirmacao" class="text-sm whitespace-pre-line"></div>
      <div class="flex gap-3 mt-5">
        <button class="btn bg-gray-200 flex-1" onclick="fecharModal()">Cancelar</button>
        <button id="btnConfirmarEnvio" class="btn bg-green-700 text-white flex-1" onclick="enviarDados()">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div id="modalSucesso" class="modal-bg hidden">
  <div class="modal text-center p-6">
    <h2 class="text-xl font-bold text-green-700">Agendamento enviado</h2>
    <p id="mensagemSucesso" class="mt-3"></p>
    <button class="btn bg-blue-800 text-white mt-5" onclick="voltarLogin()">Voltar ao login</button>
  </div>
</div>

<script>
const URL_APPS_SCRIPT = '[script.google.com](https://script.google.com/macros/s/AKfycbx5oJMVVO1VFd3pbktZtEnok0ks1v1NtwZTbLSoY31t7TAlFlp9SW6RHK2ZMaKwxHjI/exec)';
const MESES = [['01','Janeiro'],['02','Fevereiro'],['03','Março'],['04','Abril'],['05','Maio'],['06','Junho'],['07','Julho'],['08','Agosto'],['09','Setembro'],['10','Outubro'],['11','Novembro'],['12','Dezembro']];
let cpfUsuario = '', nomeUsuario = '';

function chamarApi(dados) {
  return fetch(URL_APPS_SCRIPT, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(dados)
  }).then(function (r) { return r.text(); }).then(function (txt) {
    if (!txt || !txt.trim() || txt.trim().charAt(0) === '<') {
      throw new Error('O servidor retornou uma resposta inválida. Gere uma nova versão da implantação do Apps Script e confira a URL /exec.');
    }
    return JSON.parse(txt);
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' }[m];
  });
}

function formatarData(iso) {
  if (!iso) return '';
  var p = String(iso).split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}

function optionMes(id) {
  return '<select id="' + id + '" class="field" required onchange="aoMudarMes(\'' + id + '\')">' +
    '<option value="" selected disabled>Selecione o mês</option>' +
    MESES.map(function (m) { return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') +
    '</select>';
}

function criarOpcoes() {
  var h = '';
  for (var i = 1; i <= 3; i++) {
    h += '<div class="choice"><h3 class="font-bold mb-3">' + i + 'ª Opção</h3>' +
      '<label class="label">Tipo de férias</label>' +
      '<select id="tipo' + i + '" class="field" required onchange="alterarTipo(' + i + ')">' +
      '<option value="" selected disabled>Selecione o tipo de período</option>' +
      '<option value="30">30 dias diretos</option>' +
      '<option value="15">15 + 15 dias</option></select>' +
      '<div id="bloco30_' + i + '" class="hidden mt-3">' +
      '<label class="label">Mês de início</label>' + optionMes('mes' + i) +
      '<label class="label mt-3">Data de início</label>' +
      '<input id="data' + i + '" type="date" class="field" disabled required></div>' +
      '<div id="bloco15_' + i + '" class="hidden mt-3">' +
      '<p class="sub">Os dois períodos devem iniciar em meses diferentes.</p>' +
      '<div class="grid2"><div><label class="label">1º mês</label>' + optionMes('mes' + i + 'a') +
      '<label class="label mt-2">Início</label>' +
      '<input id="data' + i + 'a" type="date" class="field" disabled required></div>' +
      '<div><label class="label">2º mês</label>' + optionMes('mes' + i + 'b') +
      '<label class="label mt-2">Início</label>' +
      '<input id="data' + i + 'b" type="date" class="field" disabled required></div></div></div></div>';
  }
  document.getElementById('opcoes').innerHTML = h;
}

function diasMes(m) {
  return new Date(2027, Number(m), 0).getDate();
}

function configurarData(el, m) {
  if (!el) return;
  el.disabled = !m;
  if (m) {
    el.min = '2027-' + m + '-01';
    el.max = '2027-' + m + '-' + String(diasMes(m)).padStart(2, '0');
    if (el.value && (el.value < el.min || el.value > el.max)) el.value = '';
  } else {
    el.value = '';
    el.removeAttribute('min');
    el.removeAttribute('max');
  }
}

function dataIdDoMes(id) {
  if (id.endsWith('a')) return 'data' + id.replace('mes', '').replace('a', '') + 'a';
  if (id.endsWith('b')) return 'data' + id.replace('mes', '').replace('b', '') + 'b';
  return 'data' + id.replace('mes', '');
}

function aoMudarMes(id) {
  configurarData(document.getElementById(dataIdDoMes(id)), document.getElementById(id).value);
  atualizarBloqueiosMeses();
}

function alterarTipo(i) {
  var t = document.getElementById('tipo' + i).value;
  document.getElementById('bloco30_' + i).classList.toggle('hidden', t !== '30');
  document.getElementById('bloco15_' + i).classList.toggle('hidden', t !== '15');
  if (t === '30') {
    configurarData(document.getElementById('data' + i), document.getElementById('mes' + i).value);
  } else if (t === '15') {
    configurarData(document.getElementById('data' + i + 'a'), document.getElementById('mes' + i + 'a').value);
    configurarData(document.getElementById('data' + i + 'b'), document.getElementById('mes' + i + 'b').value);
  }
  atualizarBloqueiosMeses();
}

function obter(i) {
  var t = document.getElementById('tipo' + i).value;
  if (t === '30') {
    return { tipo: t, meses: [document.getElementById('mes' + i).value], inicio: [document.getElementById('data' + i).value] };
  }
  return {
    tipo: t,
    meses: [document.getElementById('mes' + i + 'a').value, document.getElementById('mes' + i + 'b').value],
    inicio: [document.getElementById('data' + i + 'a').value, document.getElementById('data' + i + 'b').value]
  };
}

function validar() {
  var arr = [];
  for (var i = 1; i <= 3; i++) {
    var x = obter(i);
    if (!x.tipo || x.meses.some(function (m) { return !m; }) || x.inicio.some(function (d) { return !d; })) {
      return 'Preencha completamente as três opções.';
    }
    if (x.tipo === '15' && x.meses[0] === x.meses[1]) {
      return 'Na opção ' + i + ', os períodos 15 + 15 devem estar em meses diferentes.';
    }
    arr.push(x);
  }
  for (var a = 0; a < 3; a++) {
    for (var b = a + 1; b < 3; b++) {
      if (arr[a].tipo === arr[b].tipo && arr[a].meses.some(function (m) { return arr[b].meses.indexOf(m) !== -1; })) {
        return 'As opções ' + (a + 1) + ' e ' + (b + 1) + ' não podem repetir mês quando possuem o mesmo tipo de férias.';
      }
    }
  }
  return '';
}

function atualizarBloqueiosMeses() {
  var ids = [];
  for (var i = 1; i <= 3; i++) ids.push('mes' + i, 'mes' + i + 'a', 'mes' + i + 'b');
  ids.forEach(function (id) {
    var s = document.getElementById(id);
    if (!s) return;
    Array.prototype.forEach.call(s.options, function (o) { o.disabled = false; });
  });
  var usados = [];
  for (var j = 1; j <= 3; j++) {
    var x = obter(j);
    if (x.tipo) usados.push(x);
  }
  for (var k = 1; k <= 3; k++) {
    var atual = obter(k);
    ['mes' + k, 'mes' + k + 'a', 'mes' + k + 'b'].forEach(function (id) {
      var s = document.getElementById(id);
      if (!s) return;
      Array.prototype.forEach.call(s.options, function (o) {
        if (!o.value) return;
        var bloquear = usados.some(function (y) {
          return y !== atual && y.tipo === atual.tipo && y.meses.indexOf(o.value) !== -1;
        });
        if (atual.tipo === '15' && id.slice(-1) === 'b' && o.value === document.getElementById('mes' + k + 'a').value) bloquear = true;
        if (atual.tipo === '15' && id.slice(-1) === 'a' && o.value === document.getElementById('mes' + k + 'b').value) bloquear = true;
        o.disabled = bloquear;
      });
    });
  }
}

function nomeMes(m) {
  var achado = MESES.filter(function (a) { return a[0] === m; })[0];
  return achado ? achado[1] : '';
}

function resumo(i) {
  var x = obter(i);
  if (x.tipo === '30') {
    return i + 'ª OPÇÃO\n30 dias | ' + nomeMes(x.meses[0]) + ' | Início: ' + formatarData(x.inicio[0]);
  }
  return i + 'ª OPÇÃO\n15 + 15 dias | ' + nomeMes(x.meses[0]) + ' (' + formatarData(x.inicio[0]) + ') + ' +
    nomeMes(x.meses[1]) + ' (' + formatarData(x.inicio[1]) + ')';
}

function abrirConfirmacao() {
  var erro = validar();
  if (erro) { mostrar('mensagemEscolhas', erro, true); return; }
  document.getElementById('mensagemEscolhas').innerHTML = '';
  document.getElementById('resumoConfirmacao').textContent =
    'Servidor: ' + nomeUsuario + '\n\n' + [1, 2, 3].map(resumo).join('\n\n') +
    '\n\nConfira todas as informações antes de confirmar o envio.';
  document.getElementById('modalConfirmacao').classList.remove('hidden');
}

function enviarDados() {
  var b = document.getElementById('btnConfirmarEnvio');
  b.disabled = true;
  chamarApi({ acao: 'salvar', cpf: cpfUsuario, nome: nomeUsuario, op1: resumo(1), op2: resumo(2), op3: resumo(3) })
    .then(function (out) {
      if (!out.sucesso) {
        if (out.jaEnviado) throw new Error(out.mensagem + ' Protocolo: ' + (out.protocolo || ''));
        throw new Error(out.mensagem || 'Falha ao salvar.');
      }
      fecharModal();
      document.getElementById('mensagemSucesso').textContent = 'Protocolo: ' + out.protocolo;
      document.getElementById('modalSucesso').classList.remove('hidden');
    })
    .catch(function (e) { alert('Erro ao enviar dados:\n\n' + e.message); })
    .then(function () { b.disabled = false; });
}

function mostrar(id, t, erro) {
  var e = document.getElementById(id);
  e.innerHTML = t;
  e.className = 'msg ' + (erro ? 'err' : 'ok');
}

function fecharModal() {
  document.getElementById('modalConfirmacao').classList.add('hidden');
}

function liberarTodosOsMeses() {
  var sels = document.querySelectorAll('select[id^="mes"]');
  Array.prototype.forEach.call(sels, function (s) {
    Array.prototype.forEach.call(s.options, function (o) { o.disabled = false; });
  });
}

function limparEscolhas() {
  if (!confirm('Deseja realmente limpar todas as escolhas de férias?')) return;
  resetarFormularioFerias();
  document.getElementById('mensagemEscolhas').innerHTML = '';
  fecharModal();
  document.getElementById('tipo1').focus();
}

function resetarFormularioFerias() {
  document.getElementById('formFerias').reset();
  for (var i = 1; i <= 3; i++) {
    document.getElementById('bloco30_' + i).classList.add('hidden');
    document.getElementById('bloco15_' + i).classList.add('hidden');
    ['data' + i, 'data' + i + 'a', 'data' + i + 'b'].forEach(function (id) {
      configurarData(document.getElementById(id), '');
    });
  }
  liberarTodosOsMeses();
}

function voltarLogin() {
  fecharModal();
  document.getElementById('modalSucesso').classList.add('hidden');
  document.getElementById('telaEscolhas').classList.add('hidden');
  document.getElementById('telaLogin').classList.remove('hidden');
  document.getElementById('formLogin').reset();
  document.getElementById('mensagemLogin').innerHTML = '';
  resetarFormularioFerias();
}

function mascaraCPF(v) {
  return v.replace(/\D/g, '').slice(0, 11)
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
}

function realizarLogin() {
  var b = document.getElementById('btnLogin');
  b.disabled = true;
  document.getElementById('mensagemLogin').innerHTML = '';
  chamarApi({ acao: 'login', cpf: document.getElementById('cpf').value, re: document.getElementById('re').value })
    .then(function (out) {
      if (!out.sucesso) {
        if (out.jaEnviado) {
          mostrar('mensagemLogin', esc(out.mensagem || 'Este usuário já realizou o envio.') +
            '<br><strong>Protocolo: ' + esc(out.protocolo || 'não informado') + '</strong>', true);
          return;
        }
        throw new Error(out.mensagem || 'CPF ou RE inválidos.');
      }
      cpfUsuario = out.cpf;
      nomeUsuario = out.nome || '';
      document.getElementById('nomeServidor').textContent = nomeUsuario;
      document.getElementById('telaLogin').classList.add('hidden');
      document.getElementById('telaEscolhas').classList.remove('hidden');
      resetarFormularioFerias();
    })
    .catch(function (e) { mostrar('mensagemLogin', esc(e.message), true); })
    .then(function () { b.disabled = false; });
}

document.addEventListener('DOMContentLoaded', function () {
  criarOpcoes();
  document.getElementById('cpf').addEventListener('input', function (e) {
    e.target.value = mascaraCPF(e.target.value);
  });
  document.getElementById('formLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    realizarLogin();
  });
  document.getElementById('formFerias').addEventListener('submit', function (e) {
    e.preventDefault();
    abrirConfirmacao();
  });
});
</script>
</body>
</html>
